<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PhatPanda &middot; Cultivation (TV 2)</title>
<link rel="stylesheet" href="styles.css">
<style>
.cult-cols{grid-template-columns:1fr 1fr;height:330px;}
.cult-cols .panel{height:100%;overflow:hidden;}
.podium{display:flex;flex-direction:column;gap:5px;flex:1;overflow:hidden;}
.trim-strip{margin:6px 28px 12px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:10px 14px;}
.trim-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.trim-title{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--green);}
.trim-sub{font-size:11px;color:var(--muted);font-weight:600;}
.trim-items{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.trim-item{background:var(--panel2);border-left:3px solid var(--green);border-radius:5px;padding:6px 9px;
  font-size:12px;line-height:1.3;}
.trim-item.aging{border-left-color:var(--amber);}
.trim-item.stale{border-left-color:var(--red);}
.trim-item .strain{font-weight:800;}
.trim-item .meta{font-size:10px;color:var(--muted);font-weight:600;}
.trim-item .age{float:right;font-weight:800;color:var(--green);}
.trim-item.aging .age{color:var(--amber);}
.trim-item.stale .age{color:var(--red);}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <a class="back" href="index.html">&larr; Index</a>
  <div id="app"></div>
  <div id="overlay" class="overlay hidden"><div class="ov-inner">
    <div class="ov-icon" id="ov-icon">&#127942;</div>
    <div class="ov-tag" id="ov-tag">PERSONAL BEST</div>
    <div class="ov-name" id="ov-name">Mariah Scroggins</div>
    <div class="ov-sub" id="ov-sub">4.65 lb/hr &mdash; new 14-day record</div>
  </div></div>
  <canvas id="confetti"></canvas>
  <div class="sound-hint">&#128266; click to enable sound</div>
</div></div>
<script src="common.js"></script>
<script>
const DATA = {
  bucking_target: 3.0,
  kpis: { lbs_bucked: 1247, lbs_pruned: 102, lots_trimmed: 6, avg_rate: 4.18 },
  bucking: [
    {name:"Paul Delaney",       rate:4.91, badge:"CLIMBER"},
    {name:"Nalani Phipps",      rate:4.87},
    {name:"Mariah Scroggins",   rate:4.65, badge:"PR"},
    {name:"Adam Hutyler",       rate:4.58},
    {name:"Kyllian Freeman",    rate:4.41},
    {name:"Cassidy Caraker",    rate:4.32},
    {name:"Joseph Guinsler",    rate:4.27},
    {name:"Katelyn McClellan",  rate:4.18},
    {name:"Jermaine Hockaday",  rate:4.05},
    {name:"Shelby Norton",      rate:3.84},
    {name:"Calvin Moore",       rate:3.42},
    {name:"Matt Pollock",       rate:3.35},
    {name:"John Carroll",       rate:3.19},
    {name:"Logan Bursch",       rate:2.04}
  ],
  prune: [
    {name:"Kraig Krashowetz",  lbs:18.4, hrs:8.5},
    {name:"Holly Surgenor",    lbs:15.7, hrs:8.5},
    {name:"Jamie Tart",        lbs:14.9, hrs:8.5},
    {name:"Kerri Williams",    lbs:13.6, hrs:7.0},
    {name:"Kevin Schroeder",   lbs:12.3, hrs:8.5},
    {name:"Abdias Castillo",   lbs:10.1, hrs:8.5},
    {name:"Wyatt Farnsworth",  lbs: 9.2, hrs:8.5},
    {name:"Anna Gasca",        lbs: 7.8, hrs:6.0}
  ],
  trim: [
    {strain:"Trophy Wife",         room:"17B", lbs:169, days:1, state:"ok"},
    {strain:"OG Chem",             room:"22B", lbs:162, days:2, state:"ok"},
    {strain:"Golden Pineapple",    room:"3B",  lbs:134, days:2, state:"ok"},
    {strain:"Apple MAC",           room:"21A", lbs:99,  days:5, state:"stale"},
    {strain:"Jack Herer",          room:"12B", lbs:95,  days:3, state:"aging"},
    {strain:"Wedding Cake",        room:"5A",  lbs:78,  days:4, state:"aging"},
    {strain:"MAC Stomper",         room:"9A",  lbs:86,  days:2, state:"ok"},
    {strain:"Cenex",               room:"5B",  lbs:19,  days:1, state:"ok"}
  ]
};

function rateClass(r){ return r>=4.0?'green':(r>=3.0?'amber':'red'); }
function podiumRow(p, i, type){
  const cls = i<3 ? ('r'+(i+1)) : '';
  const medal = ['\u{1F947}','\u{1F948}','\u{1F949}'][i] || ('#'+(i+1));
  const badge = p.badge ? '<span style="font-size:9px;font-weight:900;letter-spacing:.12em;'
    +'background:var(--green);color:#000;padding:2px 6px;border-radius:3px;margin-left:6px;">'
    +esc(p.badge)+'</span>' : '';
  let valHtml;
  if(type==='bucking'){
    valHtml = '<span class="lr-val '+rateClass(p.rate)+'">'+p.rate.toFixed(2)
      +'<span style="font-size:10px;color:var(--muted);font-weight:600;"> lb/hr</span></span>';
  } else {
    valHtml = '<span class="lr-val green">'+p.lbs.toFixed(1)
      +'<span style="font-size:10px;color:var(--muted);font-weight:600;"> lb</span></span>';
  }
  return '<div class="lrow '+cls+'">'
    +'<div class="lr-medal">'+medal+'</div>'
    +'<div><div class="lr-name">'+esc(p.name)+badge+'</div>'
    +'<div class="lr-sub">'+(type==='bucking'?'14-day rolling':p.hrs.toFixed(1)+' hr today')+'</div></div>'
    +valHtml+'</div>';
}

function render(){
  const k = DATA.kpis;
  const html = ''
    // header
    +'<div class="header">'
      +'<div class="brand"><div class="panda">P</div>'
      +'<div><div class="brand-name">PHATPANDA</div>'
      +'<div class="brand-title">CULTI<em>VATION</em></div></div></div>'
      +'<div class="head-mid"><div class="head-day">TUESDAY</div>'
      +'<div class="head-date">MAY 26, 2026</div></div>'
      +'<div class="head-right"><div class="clock" id="clock">--:--</div>'
      +'<div class="updated"><span class="dot"></span>live</div></div></div>'
    // KPIs
    +'<div class="kpis c5">'
      +tile("LBS BUCKED TODAY", k.lbs_bucked.toLocaleString(), "from bucking team", "green")
      +tile("LBS PRUNED TODAY", k.lbs_pruned.toLocaleString(), "green waste collected", "")
      +'<div class="kpi feature"><div class="kpi-label">AVG LB/HR  &middot;  BUCKING</div>'
        +'<div class="kpi-val">'+k.avg_rate.toFixed(2)+'</div>'
        +'<div class="kpi-sub">target 3.00 &middot; '+(k.avg_rate>=3?'✅ ABOVE TARGET':'BELOW TARGET')+'</div></div>'
      +tile("TRIM LOTS DONE", k.lots_trimmed, "Mobius today", "green")
      +tile("HEALTH", "\u{1F7E2}", "all teams on pace", "green")
    +'</div>'
    // headline band
    +'<div class="headline"><span class="hl-tag">PERSONAL BEST</span>'
      +'<span class="hl-text"><b>Mariah Scroggins</b> just hit <b>4.65 lb/hr</b> &mdash; new 14-day record</span></div>'
    // two-column leaderboards
    +'<div class="cols c2 cult-cols">'
      // BUCKING
      +'<div class="panel"><div class="p-head">'
        +'<div class="p-title">BUCKING &middot; 14-DAY ROLLING</div>'
        +'<div class="p-sub">target 3.0 lb/hr</div></div>'
        +'<div class="podium">'+ DATA.bucking.slice(0,9).map((p,i)=>podiumRow(p,i,'bucking')).join('') +'</div></div>'
      // PRUNE
      +'<div class="panel"><div class="p-head">'
        +'<div class="p-title">PRUNE TEAM &middot; TODAY</div>'
        +'<div class="p-sub">'+DATA.prune.length+' on shift</div></div>'
        +'<div class="podium">'+ DATA.prune.map((p,i)=>podiumRow(p,i,'prune')).join('') +'</div></div>'
    +'</div>'
    // trim queue strip
    +'<div class="trim-strip"><div class="trim-head">'
      +'<div class="trim-title">TRIM QUEUE  &middot;  MOBIUS</div>'
      +'<div class="trim-sub">'+DATA.trim.length+' lots waiting &middot; oldest 5 days</div></div>'
      +'<div class="trim-items">'+ DATA.trim.slice(0,8).map(t=>
        '<div class="trim-item '+(t.state==='stale'?'stale':t.state==='aging'?'aging':'')+'">'
        +'<span class="age">'+t.days+'d</span>'
        +'<div class="strain">'+esc(t.strain)+'</div>'
        +'<div class="meta">'+esc(t.room)+' &middot; '+t.lbs+' lb</div></div>'
      ).join('') +'</div></div>';
  $('#app').innerHTML = html;
  bootStage();
  // celebrate PR on load
  setTimeout(()=>celebrate({
    icon:'\u{1F3C6}', tag:'PERSONAL BEST', name:'Mariah Scroggins',
    sub:'4.65 lb/hr  &mdash;  new 14-day record', sound:'fanfare'
  }), 800);
}

function tile(lbl,val,sub,cls){
  return '<div class="kpi '+(cls||'')+'"><div class="kpi-label">'+lbl
    +'</div><div class="kpi-val">'+val+'</div><div class="kpi-sub">'+sub+'</div></div>';
}

render();
</script>
</body></html>
