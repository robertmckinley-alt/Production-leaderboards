<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PhatPanda &middot; Packaging (TV 4)</title>
<link rel="stylesheet" href="styles.css">
<style>
.pk-cols{grid-template-columns:1fr 1.2fr;height:380px;}
.pk-cols .panel{height:100%;overflow:hidden;}
.podium{display:flex;flex-direction:column;gap:5px;flex:1;overflow:hidden;}
.brand-bar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin-top:6px;}
.brand-bar div{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#000;}
.brand-bar .panda{background:var(--green);}
.brand-bar .dab{background:#fff;color:#000;}
.brand-bar .snick{background:var(--amber);}
.brand-legend{display:flex;gap:14px;font-size:10px;font-weight:700;color:var(--muted);margin-top:4px;}
.brand-legend span{display:flex;align-items:center;gap:4px;}
.brand-legend i{width:10px;height:10px;border-radius:2px;}
.bp{display:inline-block;font-size:9px;font-weight:900;padding:2px 5px;border-radius:3px;margin-left:6px;letter-spacing:.08em;}
.bp.PANDA{background:var(--green);color:#000;}
.bp.DABSTRACT{background:#fff;color:#000;}
.bp.SNICKLEFRITZ{background:var(--amber);color:#000;}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <a class="back" href="index.html">&larr; Index</a>
  <div id="app"></div>
  <div id="overlay" class="overlay hidden"><div class="ov-inner">
    <div class="ov-icon" id="ov-icon">&#9888;&#65039;</div>
    <div class="ov-tag" id="ov-tag">DOWNTIME ALERT</div>
    <div class="ov-name" id="ov-name">MACHINE 3</div>
    <div class="ov-sub" id="ov-sub">idle 12 min &mdash; needs attention</div>
  </div></div>
  <canvas id="confetti"></canvas>
  <div class="sound-hint">&#128266; click to enable sound</div>
</div></div>
<script src="common.js"></script>
<script>
const DATA = {
  kpis: { total_units: 8640, scale_rate: 451, pack_rate: 312, downtime_min: 12 },
  machines: [
    {code:"M1", strain:"Citronella",       size:"7g",   rate:451, today:1820, state:"green", status:"RUNNING"},
    {code:"M2", strain:"Donny Burger",     size:"14g",  rate:253, today:1240, state:"amber", status:"SLOW"},
    {code:"M3", strain:"—",                size:"—",    rate:0,   today: 980, state:"red",   status:"DOWN 12m"},
    {code:"M4", strain:"Trophy Wife",      size:"3.5g", rate:402, today:1620, state:"green", status:"RUNNING"}
  ],
  packagers: [
    {id:"4748", name:"Sasha Patel",   rate:164, today:1310, brand:"DABSTRACT",    product:"Carts"},
    {id:"1194", name:"Jamie Lee",     rate:158, today:1240, brand:"PANDA",        product:"Carts"},
    {id:"4933", name:"Ron Diaz",      rate:152, today:1150, brand:"DABSTRACT",    product:"AIOs"},
    {id:"1999", name:"Mike Chen",     rate:144, today:1080, brand:"DABSTRACT",    product:"AIOs"},
    {id:"4060", name:"Lily Park",     rate:138, today:1020, brand:"PANDA",        product:"Dabs"},
    {id:"3027", name:"Theo Reyes",    rate:125, today: 940, brand:"DABSTRACT",    product:"Carts"},
    {id:"4579", name:"Hannah Quinn",  rate:117, today: 880, brand:"DABSTRACT",    product:"Dabs"},
    {id:"5015", name:"Marcus Ortiz",  rate:112, today: 850, brand:"DABSTRACT",    product:"Carts"},
    {id:"3163", name:"Erin Walsh",    rate:104, today: 780, brand:"SNICKLEFRITZ", product:"Carts"},
    {id:"2006", name:"Priya Joshi",   rate: 98, today: 720, brand:"PANDA",        product:"AIOs"}
  ],
  brand_mix: { PANDA:35, DABSTRACT:50, SNICKLEFRITZ:15 },
  product_mix: { Carts:60, AIOs:25, Dabs:12, Joints:3 }
};

function machineTile(m){
  const stateLabel = {green:"\u{1F7E2}", amber:"\u{1F7E1}", red:"\u{1F534}"}[m.state] || "";
  return '<div class="machine '+m.state+'">'
    +'<div><div class="m-code">'+esc(m.code)+'</div>'
    +'<div class="m-strain">'+esc(m.strain)+(m.size!=='—'?' &middot; '+esc(m.size):'')+'</div></div>'
    +'<div><div class="m-rate">'+(m.rate||'—')
    +(m.rate?'<span style="font-size:11px;color:var(--muted);font-weight:600;"> u/hr</span>':'')+'</div>'
    +'<div class="m-stat '+m.state+'">'+stateLabel+' '+esc(m.status)+' &middot; '+m.today.toLocaleString()+' today</div></div></div>';
}
function pkRow(p, i){
  const cls = i<3 ? ('r'+(i+1)) : '';
  const medal = ['\u{1F947}','\u{1F948}','\u{1F949}'][i] || ('#'+(i+1));
  return '<div class="lrow '+cls+'">'
    +'<div class="lr-medal">'+medal+'</div>'
    +'<div><div class="lr-name">#'+esc(p.id)+' &middot; '+esc(p.name)
    +'<span class="bp '+p.brand+'">'+esc(p.brand)+'</span></div>'
    +'<div class="lr-sub">'+esc(p.product)+' &middot; '+p.today.toLocaleString()+' today</div></div>'
    +'<span class="lr-val green">'+p.rate
    +'<span style="font-size:10px;color:var(--muted);font-weight:600;"> /hr</span></span></div>';
}

function render(){
  const k = DATA.kpis;
  const m = DATA.brand_mix;
  const html = ''
    +'<div class="header">'
      +'<div class="brand"><div class="panda">P</div>'
      +'<div><div class="brand-name">PHATPANDA</div>'
      +'<div class="brand-title">PACK<em>AGING</em></div></div></div>'
      +'<div class="head-mid"><div class="head-day">TUESDAY</div>'
      +'<div class="head-date">MAY 26, 2026</div></div>'
      +'<div class="head-right"><div class="clock" id="clock">--:--</div>'
      +'<div class="updated"><span class="dot"></span>live</div></div></div>'
    +'<div class="kpis c5">'
      +tile("TOTAL UNITS TODAY", k.total_units.toLocaleString(), "scale + packaging", "green")
      +tile("SCALE RATE", k.scale_rate+' u/hr', "across active machines", "")
      +'<div class="kpi feature"><div class="kpi-label">PACK RATE</div>'
        +'<div class="kpi-val">'+k.pack_rate+'<span style="font-size:18px;color:var(--muted);font-weight:700;"> u/hr</span></div>'
        +'<div class="kpi-sub">'+DATA.packagers.length+' packagers on shift</div></div>'
      +tile("DOWNTIME", k.downtime_min+' min', "M3 idle &mdash; needs attention", "red")
      +tile("HEALTH", "\u{1F534}", "1 machine down", "red")
    +'</div>'
    +'<div class="headline"><span class="hl-tag">SHIFT RECORD</span>'
      +'<span class="hl-text"><b>#4748 Sasha Patel</b> &mdash; <b>164 u/hr</b> on DABSTRACT carts, beating yesterday\'s top</span></div>'
    +'<div class="cols c2 pk-cols">'
      +'<div class="panel"><div class="p-head">'
        +'<div class="p-title">SCALE SQUAD &middot; MACHINES</div>'
        +'<div class="p-sub">4 machines</div></div>'
        +'<div class="machines">'+ DATA.machines.map(machineTile).join('') +'</div>'
        +'<div style="margin-top:auto;font-size:11px;color:var(--muted);font-weight:600;text-align:center;border-top:1px solid var(--line);padding-top:8px;">'
          +'NOW: M1 Citronella &middot; M2 Donny Burger &middot; M3 awaiting &middot; M4 Trophy Wife'
        +'</div>'
      +'</div>'
      +'<div class="panel"><div class="p-head">'
        +'<div class="p-title">EXTRACTION PACKAGING &middot; LEADERBOARD</div>'
        +'<div class="p-sub">today\'s units/hr</div></div>'
        +'<div class="podium">'+ DATA.packagers.slice(0,8).map(pkRow).join('') +'</div>'
        +'<div style="border-top:1px solid var(--line);padding-top:6px;">'
          +'<div style="font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--muted);margin-bottom:4px;">BRAND MIX TODAY</div>'
          +'<div class="brand-bar">'
            +'<div class="panda" style="width:'+m.PANDA+'%;">'+m.PANDA+'%</div>'
            +'<div class="dab" style="width:'+m.DABSTRACT+'%;">'+m.DABSTRACT+'%</div>'
            +'<div class="snick" style="width:'+m.SNICKLEFRITZ+'%;">'+m.SNICKLEFRITZ+'%</div></div>'
          +'<div class="brand-legend">'
            +'<span><i style="background:var(--green);"></i>Panda</span>'
            +'<span><i style="background:#fff;"></i>Dabstract</span>'
            +'<span><i style="background:var(--amber);"></i>Snicklefritz</span></div>'
        +'</div>'
      +'</div>'
    +'</div>';
  $('#app').innerHTML = html;
  bootStage();
  setTimeout(()=>celebrate({
    icon:'\u{26A0}\u{FE0F}', tag:'DOWNTIME ALERT', name:'MACHINE 3',
    sub:'idle 12 min &mdash; needs attention', sound:'horn', confetti:0,
    duration:6000
  }), 1200);
}

function tile(lbl,val,sub,cls){
  return '<div class="kpi '+(cls||'')+'"><div class="kpi-label">'+lbl
    +'</div><div class="kpi-val">'+val+'</div><div class="kpi-sub">'+sub+'</div></div>';
}

render();
</script>
</body></html>
